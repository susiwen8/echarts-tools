<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECharts Terminal Cartesian Compare</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f1ea;
            --panel: #fffdf8;
            --border: #d7d0c3;
            --ink: #1f2937;
            --muted: #6b7280;
            --terminal: #111827;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Iowan Old Style", "Palatino Linotype", serif;
            background:
                radial-gradient(circle at top left, rgba(252, 211, 77, 0.2), transparent 28%),
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.18), transparent 24%),
                linear-gradient(180deg, #f8f4ec 0%, #efe8dc 100%);
            color: var(--ink);
        }

        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 36px;
            line-height: 1.05;
        }

        .sub {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 17px;
        }

        .sections {
            display: grid;
            gap: 24px;
        }

        .compare-block {
            display: grid;
            gap: 12px;
        }

        .compare-block h2 {
            margin: 0;
            font-size: 24px;
        }

        .compare-block .caption {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 20px;
        }

        .panel {
            background: rgba(255, 253, 248, 0.84);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 16px 20px;
            box-shadow: 0 12px 40px rgba(31, 41, 55, 0.08);
            backdrop-filter: blur(8px);
        }

        .panel h2 {
            margin: 0 0 6px;
            font-size: 18px;
            font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        }

        .panel p {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 14px;
            font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        }

        [id^="browser-"][id$="-chart"] {
            width: 100%;
            height: 420px;
            border-radius: 14px;
            overflow: hidden;
            background: white;
        }

        .terminal-shell {
            background: linear-gradient(180deg, #1f2937 0%, #0f172a 100%);
            border-radius: 16px;
            padding: 14px 16px 16px;
            min-height: 420px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .terminal-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
        }

        .dot.red { background: #fb7185; }
        .dot.yellow { background: #fbbf24; }
        .dot.green { background: #34d399; }

        .terminal-grid {
            display: block;
        }

        .terminal-grid canvas {
            display: block;
        }

        .note {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.66);
            border: 1px solid var(--border);
            font-family: "Avenir Next", "Helvetica Neue", sans-serif;
            font-size: 14px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Browser vs Terminal Cartesian Charts</h1>
        <p class="sub">Same cartesian-series data, same ECharts codepath, different renderer target.</p>
        <div id="sections" class="sections"></div>
        <div class="note">
            Current terminal output is still a coarse half-block rasterization. The biggest gaps are symbol rendering, wick/detail fidelity, grid-line subtlety, and title/axis text layout.
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "tslib": "../node_modules/tslib/tslib.es6.js",
                "zrender/": "../node_modules/zrender/"
            }
        }
    </script>

    <script>
        globalThis.process = {
            env: {
                NODE_ENV: 'production'
            }
        };
    </script>

            PictorialBarChart,
            PieChart,
            RadarChart,
            GaugeChart,
            FunnelChart,
            SankeyChart,
            TreeChart,
            TreemapChart,
            SunburstChart,
            GraphChart,
            ParallelChart,
            ThemeRiverChart

            GridComponent,
            LegendComponent,
            TitleComponent,
            VisualMapComponent,

        import { TerminalRenderer, patchECharts, initTerminalChart } from '../dist/index.js';

        echarts.use([
            BarChart,
            LineChart,
            ScatterChart,
            HeatmapChart,
            CandlestickChart,
            BoxplotChart,
            PictorialBarChart,
            PieChart,
            RadarChart,
            GaugeChart,
            FunnelChart,
            SankeyChart,
            TreeChart,
            TreemapChart,
            SunburstChart,
            GraphChart,
            ParallelChart,
            ThemeRiverChart,
            GridComponent,
            LegendComponent,
            TitleComponent,
            VisualMapComponent,
            RadarComponent,
            ParallelComponent,
            SingleAxisComponent,
            SVGRenderer,
            TerminalRenderer

        const sections = document.getElementById('sections');

        const chartConfigs = [

                }

        sections.innerHTML = chartConfigs.map(config => `
            <section class="compare-block" data-visual-id="${config.id}">
                <h2>${config.title}</h2>
                <p class="caption">${config.caption}</p>
                <div class="grid">
                    <section class="panel">
                        <h2>Browser ECharts</h2>
                        <p>${config.browserDescription}</p>
                        <div id="browser-${config.id}-chart"></div>
                    </section>
                    <section class="panel" data-visual-panel="terminal">
                        <h2>Terminal Renderer</h2>
                        <p>${config.terminalDescription}</p>
                        <div class="terminal-shell">
                            <div class="terminal-bar">
                                <span class="dot red"></span>
                                <span class="dot yellow"></span>
                                <span class="dot green"></span>
                            </div>
                            <div id="terminal-${config.id}-chart" class="terminal-grid"></div>
                        </div>
                    </section>
                </div>
            </section>
        `).join('');

        function normalizeCompareOption(option) {
            const cloned = JSON.parse(JSON.stringify(option));
            return cloned;
        }

        function normalizeBrowserOption(option) {
            const cloned = normalizeCompareOption(option);
            return cloned;
        }

        const CELL_WIDTH = 7;
        const CELL_HEIGHT = 14;

        for (const config of chartConfigs) {
            const browserChart = echarts.init(document.getElementById(`browser-${config.id}-chart`), null, {
                renderer: 'svg'
            });
            browserChart.setOption(normalizeBrowserOption(config.option));

            const terminalChart = initTerminalChart(terminalEcharts, null, {
                width: 72,
                height: 22
            });
            terminalChart.setOption(normalizeTerminalOption(config.option));
            renderTerminalGrid(
                document.getElementById(`terminal-${config.id}-chart`),
                terminalChart.renderToTerminalString()
            );
        }

        function escapeHtml(value) {
            return value
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');
        }

        function renderTerminalGrid(target, input) {
            const rows = ansiToCells(input);
            const columnCount = rows.reduce((max, row) => Math.max(max, row.length), 0);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, columnCount * CELL_WIDTH);
            canvas.height = Math.max(1, rows.length * CELL_HEIGHT);
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;
            const ctx = canvas.getContext('2d');
            ctx.font = '12px "SF Mono", "Menlo", "Consolas", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
                for (let colIndex = 0; colIndex < columnCount; colIndex++) {
                    drawTerminalCell(
                        ctx,
                        colIndex * CELL_WIDTH,
                        rowIndex * CELL_HEIGHT,
                        rows[rowIndex][colIndex] || { char: ' ', fg: '', bg: '' }
                    );
                }
            }

            target.replaceChildren(canvas);
        }

        function drawTerminalCell(ctx, x, y, cell) {
            if (cell.bg) {
                ctx.fillStyle = cell.bg;
                ctx.fillRect(x, y, CELL_WIDTH, CELL_HEIGHT);
            }

            if (cell.char === '█' && cell.fg) {
                ctx.fillStyle = cell.fg;
                ctx.fillRect(x, y, CELL_WIDTH, CELL_HEIGHT);
                return;
            }

            if (cell.char === '▀' && cell.fg) {
                ctx.fillStyle = cell.fg;
                ctx.fillRect(x, y, CELL_WIDTH, Math.ceil(CELL_HEIGHT / 2));
                return;
            }

            if (cell.char === '▄' && cell.fg) {
                ctx.fillStyle = cell.fg;
                ctx.fillRect(x, y + Math.floor(CELL_HEIGHT / 2), CELL_WIDTH, Math.ceil(CELL_HEIGHT / 2));
                return;
            }

            if (cell.char === ' ') {
                return;
            }

            ctx.fillStyle = cell.fg || '#e5e7eb';
            ctx.fillText(cell.char, x + CELL_WIDTH / 2, y + CELL_HEIGHT / 2 + 0.5);
        }

        function ansiToCells(input) {
            const tokens = input.split(/(\u001b\[[0-9;]*m)/g);
            let fg = '';
            let bg = '';
            const rows = [[]];

            for (const token of tokens) {
                if (!token) {
                    continue;
                }
                if (token.startsWith('\u001b[')) {
                    if (token === '\u001b[0m') {
                        fg = '';
                        bg = '';
                        continue;
                    }
                    const match = token.match(/\u001b\[(38|48);2;(\d+);(\d+);(\d+)m/);
                    if (match) {
                        const css = `rgb(${match[2]}, ${match[3]}, ${match[4]})`;
                        if (match[1] === '38') {
                            fg = css;
                        }
                        else {
                            bg = css;
                        }
                    }
                    continue;
                }
                for (const char of token) {
                    if (char === '\n') {
                        rows.push([]);
                        continue;
                    }
                    rows[rows.length - 1].push({ char, fg, bg });
                }
            }
            return rows;
        }
