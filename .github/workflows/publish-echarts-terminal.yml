name: publish-echarts-terminal

on:
  push:
    tags:
      - 'echarts-terminal-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-echarts-terminal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish echarts-terminal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echarts-terminal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: echarts-terminal/package-lock.json

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#echarts-terminal-v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run smoke contract suite
        run: npm run smoke:contract

      - name: Verify npm publish configuration
        run: node test/node/npm-publish-contract.mjs

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
